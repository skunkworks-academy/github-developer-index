name: Refresh GitHub Developer Index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/refresh-index.yml'

permissions:
  contents: write

concurrency:
  group: github-developer-index-data-publisher
  cancel-in-progress: false

jobs:
  refresh-south-africa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure dataset publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect and rank South Africa
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run collect:za

      - name: Rebuild country registry
        run: npm run registry

      - name: Validate snapshot and registry
        run: |
          npm test
          npm run validate

      - name: Publish South Africa dataset and registry atomically
        shell: bash
        run: |
          set -euo pipefail
          git add public/data/ZA.json public/data/countries.json

          if git diff --cached --quiet; then
            echo "No South Africa dataset or registry changes to commit."
            exit 0
          fi

          git commit -m "data: refresh South Africa developer index"

          for push_attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "South Africa dataset and registry published successfully."
              exit 0
            fi

            if [ "${push_attempt}" -ge 3 ]; then
              break
            fi

            echo "::warning::Publish attempt ${push_attempt}/3 was rejected; rebasing onto the latest main."
            if ! git pull --rebase origin main; then
              echo "::error::Unable to rebase the South Africa refresh onto the latest main."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi

            # Recompute registry metadata after a concurrent main update and
            # validate the rebased snapshot before another publication attempt.
            npm run registry
            npm run validate
            git add public/data/countries.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            sleep $((push_attempt * 10))
          done

          echo "::error::Unable to publish the South Africa refresh after 3 attempts; remote main is unchanged by this job."
          exit 1
