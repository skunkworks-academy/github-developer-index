# Deployment source: GitHub Actions
name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Refresh GitHub Developer Index'
      - 'Refresh Country Datasets'
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-developer-index-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Automated refresh commits use GITHUB_TOKEN and therefore do not recursively
    # trigger push workflows. Deploy the current main snapshot whenever either
    # refresh workflow completes, including partial country refreshes where some
    # validated country commits were published before a later country failed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
