name: Refresh Country Datasets

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/github/collect-country.mjs'
      - 'src/github/graphql-client.mjs'
      - 'src/locations/countries.mjs'
      - 'src/validation/**'
      - 'scripts/collect.mjs'
      - 'scripts/write-country-registry.mjs'
      - 'scripts/validate.mjs'
      - '.github/workflows/refresh-countries.yml'

permissions:
  contents: write

concurrency:
  group: github-developer-index-data-publisher
  cancel-in-progress: false

jobs:
  refresh-countries:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure dataset publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run deterministic tests before publishing
        run: |
          npm test
          npm run validate

      - name: Collect, validate and progressively publish countries
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CANDIDATES: 30
          HISTORY_YEARS: 5
        shell: bash
        run: |
          set -uo pipefail

          countries=(BW CM RW NG KE GH EG MA PT MX US GB CA DE FR NL IN BR AU)
          succeeded=()
          failed=()

          for code in "${countries[@]}"; do
            echo "::group::Collecting ${code}"

            if ! git pull --rebase origin main; then
              echo "::error::Unable to synchronize with main before collecting ${code}."
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              failed+=("${code}:sync")
              echo "::endgroup::"
              continue
            fi

            collected=false
            for attempt in 1 2 3; do
              echo "Collection attempt ${attempt}/3 for ${code}"
              if node scripts/collect.mjs "${code}"; then
                collected=true
                break
              fi

              git reset --hard HEAD
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done

            if [ "${collected}" != "true" ]; then
              echo "::warning::Failed to collect ${code} after 3 attempts; existing published data is unchanged."
              failed+=("${code}:collect")
              echo "::endgroup::"
              continue
            fi

            if ! npm run registry || ! npm run validate; then
              echo "::error::Validation failed for ${code}; refusing to publish generated data."
              git reset --hard HEAD
              failed+=("${code}:validate")
              echo "::endgroup::"
              continue
            fi

            count=$(node -e "const d=require('./public/data/${code}.json'); console.log(Array.isArray(d.developers) ? d.developers.length : 0)")
            echo "${code}: ${count} validated developers"

            git add "public/data/${code}.json" public/data/countries.json
            if git diff --cached --quiet; then
              echo "${code}: validated data is unchanged."
              succeeded+=("${code}")
              echo "::endgroup::"
              continue
            fi

            git commit -m "data: refresh ${code} developer index"

            published=false
            for push_attempt in 1 2 3; do
              if git push origin HEAD:main; then
                published=true
                break
              fi
              if [ "${push_attempt}" -lt 3 ]; then
                sleep $((push_attempt * 10))
              fi
            done

            if [ "${published}" != "true" ]; then
              echo "::error::Unable to publish ${code}; resetting local state to origin/main."
              git fetch origin main
              git reset --hard origin/main
              failed+=("${code}:push")
              echo "::endgroup::"
              continue
            fi

            succeeded+=("${code}")
            echo "::endgroup::"
          done

          {
            echo "## Country refresh summary"
            echo
            echo "Successful: ${succeeded[*]:-none}"
            echo
            echo "Failed: ${failed[*]:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

          printf 'Successful countries: %s\n' "${succeeded[*]:-none}"
          printf 'Failed countries: %s\n' "${failed[*]:-none}"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::One or more country refreshes failed. Successful validated publishes were retained; failed countries kept their previous datasets."
            exit 1
          fi
