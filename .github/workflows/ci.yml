name: Validate GitHub Developer Index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test

      - name: Smoke-test South Africa collection
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CANDIDATES: 5
        run: npm run collect:za

      - name: Smoke-test generic country collection
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CANDIDATES: 2
        run: node scripts/collect.mjs PT

      - name: Validate generated data and site contract
        run: npm run validate
